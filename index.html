<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>COSMOS · 宇宙百科</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#000;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:14px;color:#fff;overflow:hidden}
.phone{position:relative;width:100%;max-width:420px;height:min(880px,94vh);
  border-radius:38px;background:#05060A;overflow:hidden;
  box-shadow:0 0 0 1px #1b1f2e,0 30px 90px rgba(0,0,0,.95);display:flex;flex-direction:column}
.bg-stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.85)}50%{opacity:.9;transform:scale(1.15)}}

/* ============ 开场动画 ============ */
.splash{position:absolute;inset:0;z-index:999;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%, #0c1130 0%, #05060A 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.1s cubic-bezier(.4,0,.2,1), transform 1.1s cubic-bezier(.4,0,.2,1);
  opacity:1;pointer-events:auto}
.splash.hide{opacity:0;transform:scale(1.15);pointer-events:none}
.splash-sky{position:absolute;inset:0;pointer-events:none}
.splash-sky .ss{position:absolute;border-radius:50%;background:#fff;
  animation:splashTw 3s infinite ease-in-out}
@keyframes splashTw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}}

.shooting{position:absolute;top:22%;left:-30%;width:200px;height:2px;
  background:linear-gradient(90deg, rgba(180,220,255,0) 0%, rgba(180,220,255,.4) 50%, #fff 100%);
  border-radius:2px;filter:drop-shadow(0 0 8px #8ec5ff);
  animation:shoot 3s cubic-bezier(.5,.1,.5,.9) infinite;transform:rotate(14deg)}
.shooting.s2{top:60%;left:-40%;animation-delay:1.2s;transform:rotate(10deg)}
.shooting.s3{top:78%;left:-25%;animation-delay:2.1s;transform:rotate(18deg)}
@keyframes shoot{
  0%{left:-30%;opacity:0}
  10%{opacity:1}
  70%{opacity:1}
  100%{left:130%;opacity:0}
}

.splash-glow{position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(124,92,231,.32) 0%, rgba(124,92,231,0) 70%);
  animation:glowPulse 4s ease-in-out infinite;top:50%;left:50%;
  transform:translate(-50%,-50%)}
@keyframes glowPulse{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}
}

.splash-content{position:relative;z-index:2;text-align:center;padding:0 30px}

.splash-bus-wrap{opacity:0;transform:translateY(24px);
  animation:fadeUp 1.3s .5s cubic-bezier(.2,.9,.25,1) forwards}
.bus-svg{filter:drop-shadow(0 0 22px rgba(140,120,255,.65))}

.splash-welcome{font-size:15px;letter-spacing:8px;color:#9aa5d8;
  opacity:0;transform:translateY(16px);margin-top:22px;padding-left:8px;
  animation:fadeUp 1.2s 1.5s cubic-bezier(.2,.9,.25,1) forwards}

.splash-bus{font-size:38px;font-weight:900;letter-spacing:5px;margin-top:10px;
  opacity:0;transform:translateY(20px) scale(.94);
  background:linear-gradient(120deg,#ffffff 5%,#a78bfa 45%,#7dd3fc 80%,#ffffff 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUpBus 1.5s 2.1s cubic-bezier(.2,.9,.25,1) forwards,
            shimmer 4s 3.4s linear infinite}

@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpBus{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-60% 0}}

.splash-divider{width:0;height:1px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,#7c6cf0,transparent);
  animation:divGrow 1.4s 3s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes divGrow{to{width:200px}}

.splash-sub{font-size:11px;letter-spacing:4px;color:#5e6690;margin-top:18px;
  opacity:0;animation:fadeUp 1.2s 3.4s cubic-bezier(.2,.9,.25,1) forwards}

.splash-skip{position:absolute;bottom:34px;right:28px;font-size:11px;color:#4d5470;
  letter-spacing:1px;padding:6px 12px;border:1px solid #1f2438;border-radius:999px;
  z-index:1000;opacity:0;animation:fadeUp 1s 1.2s forwards;cursor:pointer;
  pointer-events:auto !important}
.splash-skip:active{background:rgba(255,255,255,.08);color:#8b94b8}

/* ============ 主应用 ============ */
.app{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
  opacity:0;transition:opacity 1s .3s ease}
.app.show{opacity:1}

.topbar{padding:26px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.topbar h1{font-size:27px;letter-spacing:4px;font-weight:800;
  background:linear-gradient(120deg,#fff 10%,#a78bfa 70%,#7dd3fc);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .sub{display:block;font-size:10px;letter-spacing:2.5px;color:#4d5470;margin-top:5px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(108,92,231,.12);border:1px solid rgba(108,92,231,.25);color:#a78bfa;font-size:19px}

.view{flex:1;overflow-y:auto;padding:0 20px 30px;scrollbar-width:none;display:none}
.view.active{display:block}
.view::-webkit-scrollbar{display:none}

/* 分类卡片 */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px}
.cat-card{background:rgba(17,21,34,.75);border:1px solid rgba(255,255,255,.06);
  border-radius:22px;padding:18px 12px 16px;display:flex;flex-direction:column;
  align-items:center;gap:10px;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;
  user-select:none}
.cat-card:active{transform:scale(.955);border-color:rgba(139,124,246,.55);background:rgba(30,26,60,.75)}
.cat-card .cat-icon{width:68px;height:68px;display:flex;align-items:center;justify-content:center}
.cat-card .cat-name{font-size:15px;font-weight:700;color:#e9ebf4;letter-spacing:1px}
.cat-card .cat-count{font-size:11px;color:#5e6690;letter-spacing:1px}

/* 列表页顶部 */
.list-header{display:flex;align-items:center;gap:12px;padding:18px 0 14px;position:sticky;top:0;
  background:linear-gradient(180deg,#05060A 70%,transparent);z-index:5}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#9aa0b8;
  font-size:16px;cursor:pointer;flex-shrink:0}
.back-btn:active{background:rgba(255,255,255,.12)}
.list-title{font-size:19px;font-weight:700;color:#fff;letter-spacing:1px}
.list-count{font-size:11px;color:#5e6690;margin-left:auto}

/* 季节筛选 */
.season-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.season-bar::-webkit-scrollbar{display:none}
.season-tab{flex-shrink:0;padding:5px 14px;border-radius:999px;font-size:11px;color:#7d84a0;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  white-space:nowrap;cursor:pointer;transition:.2s}
.season-tab.on{color:#fff;background:linear-gradient(120deg,#6d5ce7,#9b6cf6);border-color:transparent}

/* 子列表卡片 */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub-card{background:rgba(17,21,34,.75);border:1px solid rgba(255,255,255,.06);
  border-radius:20px;padding:12px 10px 13px;display:flex;flex-direction:column;
  align-items:center;gap:7px;transition:transform .18s,border-color .18s,background .18s;
  cursor:pointer;user-select:none;overflow:hidden}
.sub-card:active{transform:scale(.955);border-color:rgba(139,124,246,.55);background:rgba(30,26,60,.75)}
.sub-card .art{width:78px;height:78px;display:flex;align-items:center;justify-content:center}
.sub-card .nm{font-size:13.5px;font-weight:600;color:#e9ebf4;letter-spacing:.5px;text-align:center}
.sub-card .en{font-size:9px;color:#545b78;letter-spacing:1.5px;text-transform:uppercase;text-align:center}

/* 详情页（保持不变） */
.detail{position:absolute;inset:0;z-index:30;background:#05060A;overflow-y:auto;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.4,0,.2,1);scrollbar-width:none}
.detail::-webkit-scrollbar{display:none}
.detail.open{transform:translateY(0)}

.d-hero{position:relative;padding:34px 0 18px;display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at 50% 45%,rgba(80,70,180,.16),transparent 68%)}
.d-hero img{width:200px;height:200px;object-fit:cover;border-radius:50%;
  box-shadow:0 0 50px rgba(124,92,231,.35)}
.d-close{position:absolute;top:16px;right:18px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#9aa0b8;
  font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.d-body{padding:0 22px 40px}
.d-cat{display:inline-block;font-size:10px;letter-spacing:2px;color:#a78bfa;
  background:rgba(139,124,246,.13);border:1px solid rgba(139,124,246,.28);
  padding:4px 11px;border-radius:999px;margin-bottom:12px}
.d-name{font-size:29px;font-weight:800;letter-spacing:1px;color:#fff;line-height:1.1}
.d-en{font-size:11px;letter-spacing:4px;color:#4f5673;margin-top:6px;text-transform:uppercase}
.d-brief{font-size:14px;line-height:1.65;color:#b9bfd4;margin:16px 0 20px;
  padding-left:13px;border-left:2px solid #7c6cf0}
.d-intro{font-size:13.5px;line-height:1.85;color:#969db5;margin:14px 0 6px;text-align:justify}

.sec{font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;margin:28px 0 14px;
  display:flex;align-items:center;gap:10px}
.sec::before{content:'';width:3px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#a78bfa,#6366f1)}
.sec::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(120,110,220,.35),transparent)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:rgba(19,23,38,.8);border:1px solid rgba(255,255,255,.055);
  border-radius:14px;padding:11px 13px}
.stat .k{font-size:10px;color:#5b6382;letter-spacing:.5px}
.stat .v{font-size:13px;color:#e3e6f2;font-weight:600;margin-top:4px}

.comp-row{margin-bottom:11px}
.comp-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.comp-head span:first-child{color:#b6bcd2}
.comp-head span:last-child{color:#6f7694;font-variant-numeric:tabular-nums}
.comp-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.055);overflow:hidden}
.comp-fill{height:100%;border-radius:3px}

.layers{display:flex;flex-direction:column;gap:9px}
.layer{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
  background:rgba(19,23,38,.7);border:1px solid rgba(255,255,255,.05);border-radius:14px}
.layer-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;
  box-shadow:0 0 10px currentColor}
.layer-n{font-size:12.5px;font-weight:600;color:#dfe3f0;margin-bottom:3px}
.layer-v{font-size:11.5px;line-height:1.55;color:#7b8299}

.extra{display:flex;flex-direction:column;gap:8px}
.extra-row{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;
  background:rgba(19,23,38,.7);border:1px solid rgba(255,255,255,.05);border-radius:13px}
.extra-row .k{font-size:12px;color:#6a7190;flex-shrink:0}
.extra-row .v{font-size:12.5px;color:#d8dceb;text-align:right;line-height:1.5}

.notes{list-style:none;display:flex;flex-direction:column;gap:10px}
.notes li{position:relative;padding-left:20px;font-size:12.5px;line-height:1.7;color:#8d94ab}
.notes li::before{content:'';position:absolute;left:4px;top:8px;width:5px;height:5px;
  border-radius:50%;background:linear-gradient(135deg,#a78bfa,#60a5fa)}
.d-footer{height:20px}
</style>
</head>
<body>
<div class="phone">
  <div class="bg-stars" id="bgStars"></div>

  <!-- 开场动画 -->
  <div class="splash" id="splash">
    <div class="splash-sky" id="splashSky"></div>
    <div class="splash-glow"></div>
    <div class="shooting"></div>
    <div class="shooting s2"></div>
    <div class="shooting s3"></div>

    <div class="splash-content">
      <div class="splash-bus-wrap">
        <svg class="bus-svg" width="86" height="86" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="busG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="45%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#60a5fa"/>
            </linearGradient>
            <radialGradient id="busCore" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#c4b5fd"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(139,124,246,.35)" stroke-width="1" stroke-dasharray="3 5">
            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="12s" repeatCount="indefinite"/>
          </circle>
          <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(96,165,250,.22)" stroke-width="1" stroke-dasharray="2 8">
            <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="18s" repeatCount="indefinite"/>
          </circle>
          <g transform="translate(0, 4)">
            <rect x="22" y="34" width="56" height="30" rx="6" fill="url(#busG)"/>
            <rect x="26" y="38" width="14" height="11" rx="2" fill="#0a0c14" opacity=".65"/>
            <rect x="44" y="38" width="14" height="11" rx="2" fill="#0a0c14" opacity=".65"/>
            <rect x="62" y="38" width="12" height="11" rx="2" fill="#0a0c14" opacity=".65"/>
            <circle cx="34" cy="66" r="4.5" fill="#1a1f33" stroke="url(#busG)" stroke-width="1.4"/>
            <circle cx="66" cy="66" r="4.5" fill="#1a1f33" stroke="url(#busG)" stroke-width="1.4"/>
            <circle cx="50" cy="49" r="2.6" fill="url(#busCore)" opacity=".95"/>
          </g>
          <path d="M 18 52 Q 6 48 2 52 Q 8 56 18 54 Z" fill="#a78bfa" opacity=".45"/>
          <path d="M 15 56 Q 4 54 1 58 Q 7 60 15 58 Z" fill="#60a5fa" opacity=".3"/>
        </svg>
      </div>

      <div class="splash-welcome">欢 迎 搭 乘</div>
      <div class="splash-bus">星际大巴车</div>
      <div class="splash-divider"></div>
      <div class="splash-sub">穿越 138 亿年 · 抵达星辰大海</div>
    </div>

    <div class="splash-skip" id="splashSkip">跳过</div>
  </div>

  <!-- 主应用 -->
  <div class="app" id="app">
    <div class="topbar">
      <div>
        <h1>COSMOS</h1>
        <span class="sub">宇宙百科 · 全景图鉴</span>
      </div>
      <div class="icon-btn">✦</div>
    </div>

    <!-- 首页分类视图 -->
    <div class="view active" id="homeView">
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <!-- 子列表视图 -->
    <div class="view" id="listView">
      <div class="list-header">
        <div class="back-btn" id="backBtn">←</div>
        <div class="list-title" id="listTitle">行星</div>
        <div class="list-count" id="listCount"></div>
      </div>
      <div class="season-bar" id="seasonBar" style="display:none"></div>
      <div class="sub-grid" id="subGrid"></div>
    </div>
  </div>

  <div class="detail" id="detail"></div>
</div>

<script>
/* ============================================================
   一、颜色工具
============================================================ */
const hexToRgb = h => {
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
};
const rgba = (h,a) => { const c = hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})`; };
const lighten = (h,p) => {
  const c = hexToRgb(h), f = p/100, m = v => Math.round(v + (255-v)*f);
  return '#' + [m(c.r),m(c.g),m(c.b)].map(v=>v.toString(16).padStart(2,'0')).join('');
};
const darken = (h,p) => {
  const c = hexToRgb(h), f = p/100, m = v => Math.round(v*(1-f));
  return '#' + [m(c.r),m(c.g),m(c.b)].map(v=>v.toString(16).padStart(2,'0')).join('');
};

/* ============================================================
   二、SVG 渲染器
============================================================ */
let _uid = 0;
const uid = () => 'u' + (++_uid);

function svgStar(p, size) {
  const u = uid();
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}">
  <defs>
    <radialGradient id="${u}h" cx="50%" cy="50%" r="50%">
      <stop offset="35%" stop-color="${rgba(p.base,0.4)}"/>
      <stop offset="100%" stop-color="${rgba(p.base,0)}"/>
    </radialGradient>
    <radialGradient id="${u}c" cx="38%" cy="33%" r="74%">
      <stop offset="0%" stop-color="#FFFEF8"/>
      <stop offset="26%" stop-color="#FFEDA8"/>
      <stop offset="56%" stop-color="${p.base}"/>
      <stop offset="100%" stop-color="${p.shadow}"/>
    </radialGradient>
    <radialGradient id="${u}r" cx="42%" cy="38%" r="72%">
      <stop offset="62%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(146,64,14,.6)"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="97" fill="url(#${u}h)"/>
  <circle cx="100" cy="100" r="67" fill="url(#${u}c)"/>
  <circle cx="100" cy="100" r="67" fill="url(#${u}r)"/>
  <g fill="#FFFBEA" opacity=".33">
    <circle cx="79" cy="82" r="5"/>
    <circle cx="119" cy="103" r="7.5" opacity=".7"/>
    <circle cx="92" cy="123" r="4"/>
    <circle cx="113" cy="71" r="3.6"/>
    <circle cx="69" cy="111" r="3.2"/>
    <circle cx="104" cy="92" r="2.4"/>
  </g>
</svg>`;
}

function svgRocky(p, size, o = {}) {
  const u = uid();
  let rnd = (o.seed || 7) * 9301 + 49297;
  const rand = () => { rnd = (rnd*9301+49297) % 233280; return rnd/233280; };
  const n = o.craters != null ? o.craters : 18;
  let cr = '';
  for (let i = 0; i < n; i++) {
    const a = rand()*Math.PI*2;
    const d = Math.sqrt(rand())*0.86;
    const x = 100 + Math.cos(a)*d*60;
    const y = 100 + Math.sin(a)*d*60;
    const r = 1.6 + rand()*7.4;
    cr += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${rgba(p.shadow,0.26+rand()*0.24)}"/>`;
    cr += `<circle cx="${(x+r*0.28).toFixed(1)}" cy="${(y+r*0.28).toFixed(1)}" r="${(r*0.72).toFixed(1)}" fill="${rgba(lighten(p.base,62),0.13)}"/>`;
  }
  const cap = o.cap ? `<ellipse cx="100" cy="40" rx="34" ry="11" fill="#ffffff" opacity=".55"/>
                       <ellipse cx="100" cy="161" rx="30" ry="9" fill="#ffffff" opacity=".4"/>` : '';
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}">
  <defs>
    <radialGradient id="${u}g" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="${lighten(p.base,45)}"/>
      <stop offset="38%" stop-color="${p.base}"/>
      <stop offset="100%" stop-color="${darken(p.shadow,32)}"/>
    </radialGradient>
    <radialGradient id="${u}s" cx="30%" cy="26%" r="86%">
      <stop offset="0%" stop-color="rgba(255,255,255,.24)"/>
      <stop offset="44%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,.62)"/>
    </radialGradient>
    <clipPath id="${u}c"><circle cx="100" cy="100" r="66"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="67" fill="url(#${u}g)"/>
  <g clip-path="url(#${u}c)">${cr}${cap}</g>
  <circle cx="100" cy="100" r="67" fill="url(#${u}s)"/>
</svg>`;
}

function svgEarth(p, size) {
  const u = uid();
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}">
  <defs>
    <radialGradient id="${u}o" cx="36%" cy="31%" r="76%">
      <stop offset="0%" stop-color="#7CB8FF"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0A1F4E"/>
    </radialGradient>

function svgConstellation(p, size, seed, starCount) {
  const u = uid();
  let rnd = (seed || 1) * 7919 + 104729;
  const rand = () => { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; };

  const pts = [];
  for (let i = 0; i < starCount; i++) {
    pts.push({
      x: 22 + rand() * 156,
      y: 22 + rand() * 156,
      r: 1.1 + rand() * 2.3,
      big: rand() > 0.72
    });
  }

  let lines = '';
  for (let i = 0; i < pts.length - 1; i++) {
    if (rand() > 0.32) {
      lines += `<line x1="${pts[i].x.toFixed(1)}" y1="${pts[i].y.toFixed(1)}"
        x2="${pts[i+1].x.toFixed(1)}" y2="${pts[i+1].y.toFixed(1)}"
        stroke="${rgba(lighten(p.base, 30), 0.6)}" stroke-width="0.9" stroke-linecap="round"/>`;
    }
  }

  let dots = '';
  pts.forEach(pt => {
    const halo = pt.big ? 3.2 : 2.2;
    dots += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${(pt.r*halo).toFixed(1)}"
      fill="${rgba(p.base, 0.3)}" filter="url(#${u}glow)"/>`;
    dots += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${pt.r.toFixed(1)}"
      fill="#ffffff" opacity="${(0.75 + rand()*0.25).toFixed(2)}"/>`;
  });

  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}">
  <defs>
    <radialGradient id="${u}bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="${rgba(p.base, 0.2)}"/>
      <stop offset="100%" stop-color="${rgba(p.base, 0)}"/>
    </radialGradient>
    <filter id="${u}glow"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#${u}bg)"/>
  ${lines}
  ${dots}
</svg>`;
}

/* 仅生成 SVG，用于首页和列表页，保证稳定 */
function renderSVGOnly(body, size) {
  const p = { base: body.color, shadow: body.color2 };
  switch (body.shape) {
    case 'star':          return svgStar(p, size);
    case 'earth':         return svgEarth(p, size);
    case 'gas':           return svgGas(p, size, body.opts || {});
    case 'comet':         return svgComet(p, size);
    case 'nebula':        return svgNebula(p, size);
    case 'galaxy':        return svgGalaxy(p, size);
    case 'medium':        return svgMedium(p, size);
    case 'constellation': return svgConstellation(p, size, body.seed || 1, body.starCount || 8);
    default:              return svgRocky(p, size, body.opts || {});
  }
}

============================================================ */
const homeView = document.getElementById('homeView');
const listView = document.getElementById('listView');
const catGrid = document.getElementById('catGrid');
const subGrid = document.getElementById('subGrid');
const listTitle = document.getElementById('listTitle');
const listCount = document.getElementById('listCount');
const seasonBar = document.getElementById('seasonBar');
const backBtn = document.getElementById('backBtn');

let currentCat = null;
let currentSeason = '全部';

function showHome() {
  homeView.classList.add('active');
  listView.classList.remove('active');
  currentCat = null;
  renderHome();
}

function showList(cat) {
  currentCat = cat;
  currentSeason = '全部';
  homeView.classList.remove('active');
  listView.classList.add('active');
  renderList();
}

/* 首页分类卡片 */
function renderHome() {
  catGrid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const items = ALL_BODIES.filter(b => b.cat === cat.id);
    const count = items.length;
    const rep = items[0];
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div class="cat-icon">${rep ? renderSVGOnly(rep, 68) : ''}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-count">${count} 个天体</div>
    `;
    card.addEventListener('click', () => showList(cat.id));
    catGrid.appendChild(card);
  });
}

/* 列表页 */
function renderList() {
  const items = ALL_BODIES.filter(b => b.cat === currentCat);
  listTitle.textContent = currentCat;
  listCount.textContent = items.length + ' 个';

  // 星座显示季节筛选
  if (currentCat === '星座') {
    seasonBar.style.display = 'flex';
    const seasons = ['全部', '春季', '夏季', '秋季', '冬季', '全年'];
    seasonBar.innerHTML = '';
    seasons.forEach(s => {
      const t = document.createElement('div');
      t.className = 'season-tab' + (s === currentSeason ? ' on' : '');
      t.textContent = s;
      t.addEventListener('click', () => {
        currentSeason = s;
        renderList();
      });
      seasonBar.appendChild(t);
    });
  } else {
    seasonBar.style.display = 'none';
  }

  let list = items;
  if (currentCat === '星座' && currentSeason !== '全部') {
    list = items.filter(b => b.season === currentSeason);
  }

  subGrid.innerHTML = '';
  list.forEach(body => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML = `
      <div class="art">${renderSVGOnly(body, 78)}</div>
      <div class="nm">${body.name}</div>
      <div class="en">${body.en}</div>
    `;
    card.addEventListener('click', () => openDetail(body));
    subGrid.appendChild(card);
  });
}

backBtn.addEventListener('click', showHome);

   七、详情页
============================================================ */
const detailEl = document.getElementById('detail');

function openDetail(body) {
  const statHtml = Object.entries(body.stats).map(([k,v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join('');

  const compHtml = body.comp.map(c => `
    <div class="comp-row">
      <div class="comp-head"><span>${c.n}</span><span>${c.v}%</span></div>
      <div class="comp-bar"><div class="comp-fill" style="width:${c.v}%;background:${c.c}"></div></div>
    </div>
  `).join('');

  const layerHtml = body.layers.map(l => `
    <div class="layer">
      <div class="layer-dot" style="background:${l.c};color:${l.c}"></div>
      <div>
        <div class="layer-n">${l.n}</div>
        <div class="layer-v">${l.v}</div>
      </div>
    </div>
  `).join('');

  const extraHtml = body.extra.map(e => `
    <div class="extra-row"><span class="k">${e.k}</span><span class="v">${e.v}</span></div>
  `).join('');

  const notesHtml = body.notes.map(n => `<li>${n}</li>`).join('');

  detailEl.innerHTML = `
    <div class="d-hero">
      <div class="d-close" id="dClose">✕</div>
      ${renderDetailArt(body, 200)}
    </div>
    <div class="d-body">
      <div class="d-cat">${body.cat}</div>
      <div class="d-name">${body.name}</div>
      <div class="d-en">${body.en}</div>
      <div class="d-brief">${body.brief}</div>
      <div class="d-intro">${body.intro}</div>

      <div class="sec">关键数据</div>
      <div class="stat-grid">${statHtml}</div>

      <div class="sec">成分组成</div>
      <div>${compHtml}</div>

      <div class="sec">结构分层</div>
      <div class="layers">${layerHtml}</div>

      <div class="sec">补充信息</div>
      <div class="extra">${extraHtml}</div>

      <div class="sec">你知道吗</div>
      <ul class="notes">${notesHtml}</ul>
      <div class="d-footer"></div>
    </div>
  `;

  detailEl.classList.add('open');
  detailEl.scrollTop = 0;

  document.getElementById('dClose').addEventListener('click', closeDetail);
}

function closeDetail() {
  detailEl.classList.remove('open');
}
